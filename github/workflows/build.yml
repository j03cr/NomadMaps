name: Build Portable Windows Executable

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build NomadMaps.exe (Release Portable)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload Portable Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NomadMaps-Portable-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/NomadMaps.exe
          if-no-files-found: error